<div class="page-header">
  <div class="header-content">
    <h2>AI Event Mapper</h2>
    <p class="status-text">{{ videoStatus() }}</p>
  </div>
  <div class="header-actions">
    <button class="btn-secondary" (click)="loadModel()" [disabled]="isLoadingModel() || isModelReady()">
      {{ isModelReady() ? 'AI Model Ready' : (isLoadingModel() ? 'Loading AI...' : 'Load AI Model') }}
    </button>
  </div>
</div>

<div class="mapper-container">
  <!-- Video Section -->
  <div class="video-section card">
    <div class="video-stage">
      <video #videoPlayer (click)="togglePlay()" preload="metadata"></video>
      <canvas #overlayCanvas (click)="onCanvasClick($event)"></canvas>
      
      <!-- Loading Overlay -->
      <div class="loading-overlay" *ngIf="isLoadingModel()">
        <div class="spinner"></div>
        <span>Warming up AI Model...</span>
      </div>
    </div>

    <div class="video-controls">
      <div class="main-controls">
        <button class="icon-btn" (click)="togglePlay()">
          <span class="material-icons">{{ videoPlayer.paused ? 'play_arrow' : 'pause' }}</span>
        </button>
        <button class="btn-primary" (click)="fileInput.click()">Upload Video</button>
        <button class="btn-secondary" (click)="loadDefaultVideo()">Use Sample Video</button>
        <input #fileInput type="file" (change)="onFileSelected($event)" accept="video/*" hidden>
      </div>
      
      <div class="ai-controls">
        <button class="btn-outline" [class.active]="isAutoDetecting()" (click)="toggleAutoDetect()" [disabled]="!isModelReady()">
          {{ isAutoDetecting() ? 'Stop Auto Detect' : 'Start Auto Detect' }}
        </button>
        <button class="btn-outline" (click)="detectFrame()" [disabled]="!isModelReady()">Detect Frame</button>
      </div>
    </div>
  </div>

  <!-- Side Panel: Pitch & Stats -->
  <div class="side-panel">
    <!-- Pitch Section -->
    <div class="pitch-section card">
      <div class="card-header">
        <h3>Pitch Visualization</h3>
        <span class="badge">Click video to map event</span>
      </div>
      <div class="pitch-container">
        <div class="pitch">
          <svg viewBox="0 0 105 68" preserveAspectRatio="none">
            <rect x="1" y="1" width="103" height="66" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" />
            <line x1="52.5" y1="1" x2="52.5" y2="67" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" />
            <circle cx="52.5" cy="34" r="9.15" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" />
            <circle cx="52.5" cy="34" r="0.5" fill="white" />
            <rect x="1" y="13.84" width="16.5" height="40.32" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" />
            <rect x="1" y="24.84" width="5.5" height="18.32" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" />
            <rect x="87.5" y="13.84" width="16.5" height="40.32" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" />
            <rect x="98.5" y="24.84" width="5.5" height="18.32" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" />
            <circle cx="11" cy="34" r="0.5" fill="white" />
            <circle cx="94" cy="34" r="0.5" fill="white" />
            <path d="M 17.5 24.84 A 9.15 9.15 0 0 1 17.5 43.16" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" />
            <path d="M 87.5 24.84 A 9.15 9.15 0 0 0 87.5 43.16" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Detections Info -->
    <div class="detections-card card">
      <h3>Active Detections</h3>
      <div class="stat-row">
        <div class="stat">
          <span class="label">People</span>
          <span class="value">{{ detections().length }}</span>
        </div>
        <div class="stat">
          <span class="label">Ball Detected</span>
          <span class="value">{{ detections().some(d => d.class === 'sports ball') ? 'YES' : 'NO' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
